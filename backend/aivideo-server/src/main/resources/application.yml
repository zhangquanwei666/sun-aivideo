# ============================================================
# 公共配置，各环境的差异放在 application-{env}.yml
#   local：本地开发，与 UAT 共用阿里云 RDS
#   uat  ：测试环境，阿里云 RDS（默认）
#   pro  ：生产环境，所有连接信息与密钥都必须通过环境变量注入
# 切换方式：SPRING_PROFILES_ACTIVE=pro 或 --spring.profiles.active=pro
# ============================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sun-aivideo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:uat}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  # Mapper XML 位置（在 aivideo-dao 模块的 resources/mapper 下），namespace 对应 com.sun.aivideo.dao.*Mapper
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sun.aivideo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

aivideo:
  cors:
    # 允许跨域的前端地址；生产环境前后端同域部署时可以不配
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

  storage:
    # 上传的首帧图片、下载到本地的视频都存这里，对外以 /files/** 访问
    base-dir: ./data
    # 百炼返回的 video_url 只有 24 小时有效，开启后生成成功会自动下载到本地
    download-video: true

  dashscope:
    # 百炼 API Key，通过环境变量 DASHSCOPE_API_KEY 注入，不要写进代码仓库
    api-key: ${DASHSCOPE_API_KEY:}
    # 华北2（北京）地域；也可换成 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
    base-url: https://dashscope.aliyuncs.com
    connect-timeout-seconds: 10
    read-timeout-seconds: 60
    # 未配置 API Key 时使用 Mock 模型，便于不花钱联调；生产环境关闭
    mock-when-no-key: true

  llm:
    # 生成前用大模型润色/扩写提示词
    enabled: true
    # 大模型厂商（策略）：qwen / mock；没配 API Key 且允许 Mock 时自动退回 mock
    provider: qwen
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: qwen-plus
    timeout-seconds: 60
    # 计费单价：元 / 百万 tokens（请以百炼控制台最新价格为准）
    input-price-per-million: 0.8
    output-price-per-million: 2.0

  polling:
    # 轮询百炼任务状态的间隔（官方建议约 15 秒）
    interval-ms: 10000
    # 超过该时长仍未完成的任务标记为超时
    timeout-minutes: 30

  mock:
    # Mock 模式下返回的示例视频（Big Buck Bunny，CC BY 3.0）
    video-url: https://www.w3schools.com/html/mov_bbb.mp4
    # 模拟生成耗时（秒）
    generate-seconds: 12
