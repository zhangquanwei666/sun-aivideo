# ============================================================
# 公共配置，各环境的差异放在 application-{env}.yml
#   uat  ：测试环境，阿里云 RDS（默认，本地开发也用这个）
#   pro  ：生产环境，连接参数由环境变量注入；凭证主密钥见 aivideo.credentials
# 切换方式：SPRING_PROFILES_ACTIVE=pro 或 --spring.profiles.active=pro
# ============================================================
server:
  # 后端端口，可用环境变量 SERVER_PORT 覆盖
  port: ${SERVER_PORT:18088}

spring:
  application:
    name: sun-aivideo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:uat}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  # Mapper XML 位置（在 aivideo-dao 模块的 resources/mapper 下），namespace 对应 com.sun.aivideo.dao.*Mapper
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sun.aivideo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

aivideo:
  credentials:
    # 固定加密主密钥；环境变量可覆盖。已存储用户 Key 后请勿直接更换，并随数据库备份保存。
    master-key: "${AIVIDEO_CREDENTIAL_MASTER_KEY:3pZ1wIWxIjMufKv41bbEB+njcibR5IN+u4lEb7/vGUM=}"
    key-id: ${AIVIDEO_CREDENTIAL_KEY_ID:v1}
  cors:
    # 允许跨域的前端地址；生产环境前后端同域部署时可以不配
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*

  storage:
    # 上传的图片、下载到本地的视频、文生图结果都存这里，对外以 /files/** 访问
    base-dir: ./data
    # 百炼返回的 video_url 只有 24 小时有效，开启后生成成功会自动下载到本地
    download-video: true

  dashscope:
    # API Key 由用户在“模型密钥”中维护；这里仅维护平台连接参数
    # 华北2（北京）地域；也可换成 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
    base-url: https://dashscope.aliyuncs.com
    connect-timeout-seconds: 10
    read-timeout-seconds: 60

  gemini:
    # API Key 由用户维护，图片和视频按任务绑定用户凭证
    # 文生图接口地址（含版本号）；国内直连不通时可换成自己的中转地址
    base-url: https://generativelanguage.googleapis.com/v1
    # 视频接口地址（Omni Flash 的 Interactions API 目前在 v1beta）
    video-base-url: https://generativelanguage.googleapis.com/v1beta
    connect-timeout-seconds: 15
    # 图片生成较慢，读取超时放宽到 180 秒
    read-timeout-seconds: 180
    # Omni 生成视频时同步等待结果，读取超时放宽到 600 秒
    video-read-timeout-seconds: 600
    # 可选：HTTP 代理，例如本机代理软件 127.0.0.1:7890；不需要时保持为空
    proxy-host: ${GEMINI_PROXY_HOST:}
    proxy-port: ${GEMINI_PROXY_PORT:}

  cost:
    # 美元兑人民币汇率：Gemini 按美元计价，费用按此折算成人民币后统计
    usd-to-cny: 7.2

  llm:
    # 生成前用大模型润色/扩写提示词
    enabled: true
    # 大模型策略：qwen；用户需配置百炼 Key。Mock 仅由显式开发模式开启
    provider: qwen
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model-name: qwen-plus
    timeout-seconds: 60
    # 计费单价：元 / 百万 tokens（请以百炼控制台最新价格为准）
    input-price-per-million: 0.8
    output-price-per-million: 2.0

  polling:
    # 查询厂商任务状态的间隔：10 秒
    interval-ms: 10000
    # 超过该时长仍未完成的任务标记为超时
    timeout-minutes: 30

  mock:
    # 显式开发模拟开关；缺少个人 Key 时不会自动模拟
    enabled: false
    # Mock 模式下返回的示例视频（Big Buck Bunny，CC BY 3.0）
    video-url: https://www.w3schools.com/html/mov_bbb.mp4
    # 模拟生成耗时（秒）
    generate-seconds: 12

sa-token:
  token-name: satoken
  timeout: 604800
  is-read-cookie: false
  is-read-body: false
  is-share: false
  token-style: random-64
