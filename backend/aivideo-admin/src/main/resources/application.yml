server:
  port: ${ADMIN_SERVER_PORT:18089}

spring:
  application:
    name: sun-aivideo-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:uat}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sun.aivideo.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: admin-token
  timeout: 604800
  is-read-cookie: false
  is-read-body: false
  is-share: false
  token-style: random-64

aivideo:
  admin:
    initial-username: ${AIVIDEO_ADMIN_USERNAME:admin}
    initial-password: ${AIVIDEO_ADMIN_PASSWORD:}
    cors-origins: ${AIVIDEO_ADMIN_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
